# 工作流名称
name: Build Kernel and Upload Artifacts

# 触发条件：手动触发 + 推送到 main 分支时触发
on:
  workflow_dispatch:  # 手动触发（推荐，避免频繁构建）
  push:
    branches: [ main ]
    paths:
      - 'kernel/**'  # 仅内核目录变更时触发（可选，减少无用构建）

# 工作流权限（用于上传 Releases）
permissions:
  contents: write

# 任务定义
jobs:
  build-kernel:
    # 运行环境：选择 Ubuntu（推荐 22.04，内核编译依赖完整）
    runs-on: ubuntu-22.04
    
    steps:
      # 步骤1：拉取当前仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 仅拉取最新代码，加快速度

      # 步骤2：安装内核编译依赖
      - name: Install Build Dependencies
        run: |
          sudo apt update
          # 内核编译核心依赖（根据实际需求调整）
          sudo apt install -y build-essential libncurses5-dev libssl-dev \
            bison flex libelf-dev bc dwarves rsync git wget

      # 步骤3：编译内核（核心步骤，根据你的内核调整命令）
      - name: Build Kernel
        run: |
          # 进入内核源码目录（根据你的仓库结构调整路径）
          cd kernel
          # 生成默认配置（或使用自定义 .config）
          make defconfig
          # 编译内核（-j 后面跟线程数，Actions 虚拟机默认 2 核，用 -j2）
          make -j$(nproc) Image modules dtbs
          # 打包产物（方便上传，这里打包镜像、模块、设备树）
          mkdir -p kernel-output
          cp arch/arm64/boot/Image kernel-output/  # 以 arm64 为例，根据架构调整
          cp arch/arm64/boot/dts/*.dtb kernel-output/
          tar -zcvf kernel-build-$(date +%Y%m%d%H%M).tar.gz kernel-output/

      # 步骤4：上传产物到 GitHub Releases
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # 上传的产物路径（匹配打包的压缩包）
          files: kernel/kernel-build-*.tar.gz
          # 生成的 Release 标签（自定义，这里用时间戳）
          tag_name: kernel-build-${{ github.run_id }}
          # Release 描述
          body: "Auto-built kernel from GitHub Actions (Run ID: ${{ github.run_id }})"
          # 是否为预发布
          prerelease: false
        # 仅在构建成功时执行上传
        if: success()
